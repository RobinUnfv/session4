server:
  port: ${PORT_SERVICE_CLIENTE}

spring:
  datasource:
    url: ${BD_POSTGRESQL_URL}
    username: ${BD_POSTGRESQL_USERNAME}
    password: ${BD_POSTGRESQL_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
     ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
         dialect: org.hibernate.dialect.PostgreSQLDialect
         format_sql: true

logging:
  level:
    root: INFO
    com.irojas.microservices: WARN
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'
  file:
    name: logs/msvc-cliente.log
    max-size: 10MB
    max-history: 30
