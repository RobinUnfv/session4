server:
  port: ${PORT_SERVICE_CLIENTE}

spring:
  datasource:
    url: ${BD_POSTGRESQL_URL}
    username: ${BD_POSTGRESQL_USERNAME}
    password: ${BD_POSTGRESQL_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
     ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
         dialect: org.hibernate.dialect.PostgreSQLDialect
         format_sql: true
