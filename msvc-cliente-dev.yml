server:
  port: ${CUSTOM.SERVER.PORT:7010}

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/erp_db
    username: cjava
    password: secret
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
     ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
         dialect: org.hibernate.dialect.PostgreSQLDialect
         format_sql: true