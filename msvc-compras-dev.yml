server:
  port: 7020

spring:
  cloud:
    config:
      uri: http://config-server:9000
      profile: dev
      enabled: true

  data:
    mongodb:
      uri: ${BD_MONGODB_URI}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL}
